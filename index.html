<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lab Notes</title>
  <meta name="description" content="A free, anime-flavored electronics course: from Ohm's law to an Arduino EMG muscle sensor.">
  <meta name="theme-color" content="#0b0820">

  <!-- installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lab Notes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;800&display=swap" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Lab Notes home"><span class="brand-bolt" aria-hidden="true">⚡</span><span class="brand-text">LAB NOTES</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Lab</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="chips">
      <button class="chip sound-toggle" id="soundToggle" type="button" title="Sound on/off">🔊</button>
      <span class="chip chip-streak" title="Daily streak (days in a row)">🔥 <b id="chipStreak">0</b></span>
      <span class="chip chip-goal" title="Minutes studied today (goal: 20)">⏱ <b id="chipGoal">0</b>/20</span>
      <span class="chip chip-xp" title="Total XP"><b id="chipXp">0</b>&nbsp;XP</span>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">Made with ⚡ for learning · progress is saved on this device · <a href="#/settings">settings &amp; backup</a></footer>

  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><p class="card">Lab Notes needs JavaScript turned on.</p></noscript>

  <script src="js/store.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/breadboard.js"></script>
  <script src="js/widgets.js"></script>
  <script src="data/course.js"></script>
  <script src="data/module-0.js"></script>
  <script src="data/module-1.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
